  <line x1="96" y1="230" x2="416" y2="230" stroke="#d4d4bc" stroke-width="4" />
  
  <!-- Quadrant 1 (Top Left): Fish -->
  <path d="M140 165 Q180 120 220 165 Q180 210 140 165 Z" stroke="#d4d4bc" stroke-width="4" fill="none" />
  <path d="M220 165 L235 150 L235 180 Z" stroke="#d4d4bc" stroke-width="4" fill="#d4d4bc" />
  
  <!-- Quadrant 2 (Top Right): Mitre -->
