name: One-shot route announcement notifications

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-route-announcement-notifications.yml

permissions:
  contents: write

jobs:
  route:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply trusted announcement routing patch
        run: node scripts/one-shot-route-announcement-notifications.mjs

      - name: Verify privacy boundary and build
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-announcement-recipient-boundary.ts
          npm run lint
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-route-announcement-notifications.mjs
          rm .github/workflows/one-shot-route-announcement-notifications.yml

      - name: Commit branch-only announcement routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add server.ts server/announcementCommunicationRoutes.ts src/pages/Announcements.tsx scripts/verify-announcement-recipient-boundary.ts package.json scripts/one-shot-route-announcement-notifications.mjs .github/workflows/one-shot-route-announcement-notifications.yml
          git diff --cached --check
          git commit -m 'privacy: route announcement recipients on trusted server'
          git push origin HEAD:redesign/mobile-first-v2
