name: Apply 1559 readiness sync

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-readiness-1559.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-readiness-1559.py
      - run: git diff --check
      - run: |
          rm scripts/patch-readiness-1559.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/redevelopment/production-readiness-evidence-2026-09-11.md scripts/patch-readiness-1559.py
          git commit -m 'docs: sync readiness to public contact boundary checkpoint'
          git push origin HEAD:redesign/mobile-first-v2
