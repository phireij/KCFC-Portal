name: Apply staging environment badge

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-staging-environment-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-staging-environment-banner.py
      - run: npx tsx scripts/verify-staging-environment-banner.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-staging-environment-banner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/Navbar.tsx scripts/patch-staging-environment-banner.py
          git commit -m 'feat: show explicit staging environment badge'
          git push origin HEAD:redesign/mobile-first-v2
