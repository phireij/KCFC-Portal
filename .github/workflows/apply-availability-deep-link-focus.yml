name: Apply availability deep-link focus

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-availability-deep-link-focus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-availability-deep-link-focus.py
      - run: npx tsx scripts/verify-availability-deep-link-focus.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-availability-deep-link-focus.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Polls.tsx scripts/patch-availability-deep-link-focus.py
          git commit -m 'fix: focus notification-linked availability request'
          git push origin HEAD:redesign/mobile-first-v2
      # rerun after verifier source-boundary correction
