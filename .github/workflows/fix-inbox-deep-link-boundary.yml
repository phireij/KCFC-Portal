name: One-shot Inbox deep-link boundary fix

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/fix-inbox-deep-link-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Harden Inbox related-page navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Inbox.tsx')
          s = p.read_text()

          anchor = "const deliveryTone = (status: NotificationDelivery['status']) => {\n  if (status === 'delivered' || status === 'read') return 'bg-green-100 text-green-700 dark:bg-green-500/15 dark:text-green-300';\n  if (status === 'failed') return 'bg-red-100 text-red-700 dark:bg-red-500/15 dark:text-red-300';\n  if (status === 'skipped') return 'bg-slate-100 text-slate-500 dark:bg-white/10 dark:text-slate-300';\n  return 'bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300';\n};"
          helper = anchor + "\n\nconst safeInboxDestination = (link: string) => {\n  try {\n    const target = new URL(link, window.location.origin);\n    if (target.origin !== window.location.origin) return '/inbox';\n    return `${target.pathname}${target.search}${target.hash}`;\n  } catch {\n    return '/inbox';\n  }\n};"
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper)

          old = "  const followMessage = () => {\n    if (selected?.link) navigate(selected.link);\n  };"
          new = "  const followMessage = () => {\n    if (selected?.link) navigate(safeInboxDestination(selected.link));\n  };"
          if s.count(old) != 1:
              raise SystemExit(f'followMessage marker count={s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          npx tsx scripts/verify-inbox-deep-link-boundary.ts
          git diff --check
          git diff -- src/pages/Inbox.tsx
      - name: Commit branch-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Inbox.tsx
          git commit -m 'fix: guard Inbox deep-link navigation'
          git push origin HEAD:redesign/mobile-first-v2
