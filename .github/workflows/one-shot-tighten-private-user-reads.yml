name: One-shot tighten private user reads

# Retry after the exact patch anchors were corrected.
on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-tighten-private-user-reads.yml

permissions:
  contents: write

jobs:
  tighten:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply private user read tightening
        run: node scripts/one-shot-tighten-private-user-reads.mjs

      - name: Verify privacy boundary and build
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-private-user-read-boundary.ts
          npm run lint
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-tighten-private-user-reads.mjs
          rm .github/workflows/one-shot-tighten-private-user-reads.yml

      - name: Commit branch-only privacy tightening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add -A firestore.rules scripts/verify-private-user-read-boundary.ts scripts/one-shot-tighten-private-user-reads.mjs .github/workflows/one-shot-tighten-private-user-reads.yml
          git diff --cached --check
          git commit -m 'privacy: restrict private user reads to member admins'
          git push origin HEAD:redesign/mobile-first-v2
