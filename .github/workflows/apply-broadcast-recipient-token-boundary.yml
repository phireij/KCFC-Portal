name: Apply broadcast recipient token boundary

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-broadcast-recipient-token-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-broadcast-recipient-token-boundary.py
      - run: npx tsx scripts/verify-broadcast-recipient-token-boundary.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-broadcast-recipient-token-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-broadcast-recipient-token-boundary.ts scripts/patch-broadcast-recipient-token-boundary.py
          git commit -m 'fix: derive broadcast push recipients server-side'
          git push origin HEAD:redesign/mobile-first-v2

# retrigger after matching live custom block
