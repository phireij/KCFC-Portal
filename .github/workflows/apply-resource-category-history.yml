name: Apply Resource category history

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-resource-category-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-resource-category-history.py
      - run: npx tsx scripts/verify-resource-category-history.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-resource-category-history.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Resources.tsx scripts/patch-resource-category-history.py
          git commit -m 'fix: preserve Resource category in URL history'
          git push origin HEAD:redesign/mobile-first-v2
