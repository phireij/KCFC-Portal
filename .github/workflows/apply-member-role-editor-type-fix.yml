name: Apply Member Role Editor Type Fix

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - '.github/migrations/apply-member-role-editor-type-fix-v1'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redevelopment branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply type correction
        run: node scripts/fix-member-role-editor-type.mjs
      - name: Typecheck corrected source
        run: npm run lint
      - name: Verify member governance rules
        run: npx tsx scripts/verify-member-governance.ts
      - name: Build corrected source
        run: npm run build
      - name: Commit corrected source
        run: |
          set -euo pipefail
          git config user.name 'KCFC Redevelopment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/admin/MemberRoleEditor.tsx
          if git diff --cached --quiet; then
            echo 'No source correction required.'
            exit 0
          fi
          git commit -m 'fix: correct member role editor Firestore typing'
          git push origin HEAD:redesign/mobile-first-v2
