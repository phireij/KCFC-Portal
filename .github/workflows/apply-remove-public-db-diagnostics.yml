name: Remove public database diagnostics route

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-remove-public-db-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-remove-public-db-diagnostics.py
      - run: npx tsx scripts/verify-public-db-diagnostics-boundary.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-remove-public-db-diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-public-db-diagnostics-boundary.ts scripts/patch-remove-public-db-diagnostics.py
          git commit -m 'fix: remove public database diagnostics exposure'
          git push origin HEAD:redesign/mobile-first-v2
