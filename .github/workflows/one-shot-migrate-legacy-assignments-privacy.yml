name: One-shot final legacy assignment privacy migration

# Retry after correcting the two compiler-proven email boundary leftovers.
on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-migrate-legacy-assignments-privacy.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply fail-closed final assignment migration
        run: node scripts/one-shot-migrate-legacy-assignments-privacy.mjs

      - name: Verify final assignment privacy postconditions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "collection(db, 'users')" src/pages/LegacyDutiesImpl.tsx
          ! grep -F "getDocs(collection(db, 'users'))" src/components/CommitteeAssignments.tsx
          grep -F 'subscribeMemberDirectory(' src/pages/LegacyDutiesImpl.tsx
          grep -F 'MemberDirectoryProfile' src/pages/LegacyDutiesImpl.tsx
          grep -F 'MemberDirectoryProfile' src/components/CommitteeAssignments.tsx
          grep -F 'MemberDirectoryProfile' src/components/ChoreCommitteeDashboard.tsx
          grep -F 'listPrivilegedPollEmailRecipients' src/components/CommitteeAssignments.tsx
          grep -F 'listPrivilegedPollEmailRecipients' src/components/ChoreCommitteeDashboard.tsx
          npx tsc --noEmit

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-migrate-legacy-assignments-privacy.mjs
          rm .github/workflows/one-shot-migrate-legacy-assignments-privacy.yml

      - name: Commit branch-only migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add src/pages/LegacyDutiesImpl.tsx src/components/CommitteeAssignments.tsx src/components/ChoreCommitteeDashboard.tsx scripts/one-shot-migrate-legacy-assignments-privacy.mjs .github/workflows/one-shot-migrate-legacy-assignments-privacy.yml
          git diff --cached --check
          git commit -m 'privacy: move legacy assignments off private profile lists'
          git push origin HEAD:redesign/mobile-first-v2
