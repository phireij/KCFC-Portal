name: One-shot Home publication boundary fix

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/fix-dashboard-publication-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Apply Home publication boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          types = Path('src/types.ts')
          s = types.read_text()
          old = "  completedAssignments?: string[];\n  rosterPublishedAt?: any;"
          new = "  completedAssignments?: string[];\n  rosterPublished?: boolean;\n  publicationMode?: 'explicit';\n  rosterPublishedAt?: any;"
          if s.count(old) != 1:
              raise SystemExit(f'Poll publication type marker count={s.count(old)}')
          types.write_text(s.replace(old, new))

          dashboard = Path('src/pages/Dashboard.tsx')
          s = dashboard.read_text()
          anchor = "const dutyLabel = (duty: DutyAssignment) => {\n  if (duty.type === 'kitchen') return duty.slot || 'Kitchen Duty';\n  if (duty.type === 'cleaning') return duty.slot || 'Cleaning Duty';\n  return duty.slot || 'Ministry Duty';\n};"
          helper = anchor + "\n\nconst isDashboardRosterPublished = (poll: Poll) => {\n  if (poll.publicationMode === 'explicit') return poll.rosterPublished === true;\n  const completed = poll.completedAssignments || [];\n  return poll.status === 'closed' && ['lector', 'altar_server', 'usher'].every((ministry) => completed.includes(ministry));\n};"
          if s.count(anchor) != 1:
              raise SystemExit(f'Dashboard helper anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper)

          old_mass = "        const completed = poll.completedAssignments || [];\n        const rosterPublished =\n          poll.status === 'closed' &&\n          ['lector', 'altar_server', 'usher'].every((ministry) => completed.includes(ministry));"
          new_mass = "        const rosterPublished = isDashboardRosterPublished(poll);"
          if s.count(old_mass) != 1:
              raise SystemExit(f'Upcoming mass publication block count={s.count(old_mass)}')
          s = s.replace(old_mass, new_mass)

          old_assignment = "        const completed = poll.completedAssignments || [];\n        const rosterPublished = ['lector', 'altar_server', 'usher'].every((ministry) => completed.includes(ministry));\n        if (!rosterPublished || !poll.assignments) return;"
          new_assignment = "        if (!isDashboardRosterPublished(poll) || !poll.assignments) return;"
          if s.count(old_assignment) != 1:
              raise SystemExit(f'Personal assignment publication block count={s.count(old_assignment)}')
          s = s.replace(old_assignment, new_assignment)

          dashboard.write_text(s)
          PY
          npx tsx scripts/verify-dashboard-roster-publication-boundary.ts
          git diff --check
          git diff -- src/types.ts src/pages/Dashboard.tsx
      - name: Commit branch-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/pages/Dashboard.tsx
          git commit -m 'fix: enforce explicit roster publication on Home'
          git push origin HEAD:redesign/mobile-first-v2
