name: Apply staging runbook 57 sync

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-staging-runbook-57.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-staging-runbook-57.py
      - run: git diff --check
      - run: |
          rm scripts/patch-staging-runbook-57.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/redevelopment/staging-deployment-runbook-2026-09-11.md scripts/patch-staging-runbook-57.py
          git commit -m 'docs: align staging runbook to 57-check contract'
          git push origin HEAD:redesign/mobile-first-v2
