name: Apply strict self-test token boundary

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-self-test-target-token-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-self-test-target-token.py
      - run: npx tsx scripts/verify-self-test-push-boundary.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-self-test-target-token.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-self-test-push-boundary.ts scripts/patch-self-test-target-token.py
          git commit -m 'fix: bind push self-test tokens to caller profile'
          git push origin HEAD:redesign/mobile-first-v2
