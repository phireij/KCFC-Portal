name: Apply Login email verification fix

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-login-email-verification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-login-email-verification.py
      - run: npx tsx scripts/verify-login-email-verification.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-login-email-verification.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Login.tsx scripts/patch-login-email-verification.py
          git commit -m 'fix: preserve Login email-verification state'
          git push origin HEAD:redesign/mobile-first-v2
