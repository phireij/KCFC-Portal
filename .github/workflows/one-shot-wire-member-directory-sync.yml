name: One-shot wire member directory synchronization

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-wire-member-directory-sync.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply fail-closed synchronization wiring
        run: node scripts/one-shot-wire-member-directory-sync.mjs

      - name: Verify synchronization boundary
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-member-directory-sync-boundary.ts
          npm run lint
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-wire-member-directory-sync.mjs
          rm .github/workflows/one-shot-wire-member-directory-sync.yml

      - name: Commit branch-only synchronization wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add server.ts server/memberDirectorySyncRoutes.ts src/lib/memberDirectorySyncClient.ts src/pages/Profile.tsx src/components/admin/MemberApprovalQueue.tsx src/components/admin/MemberRoleEditor.tsx src/pages/LegacyAdmin.tsx scripts/backfill-member-directory-staging.ts firestore.rules scripts/verify-member-public-projection.ts scripts/verify-member-directory-sync-boundary.ts package.json scripts/one-shot-wire-member-directory-sync.mjs .github/workflows/one-shot-wire-member-directory-sync.yml
          git diff --cached --check
          git commit -m 'privacy: synchronize member directory through trusted server'
          git push origin HEAD:redesign/mobile-first-v2
