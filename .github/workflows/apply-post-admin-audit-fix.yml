name: Apply KCFC Post-Admin Compatible Audit Cleanup

on:
  push:
    branches:
      - 'redesign/mobile-first-v2'
    paths:
      - '.github/workflows/apply-post-admin-audit-fix.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout redevelopment branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking runtime audit fixes
        run: npm audit fix --omit=dev
      - name: Restore development dependencies
        run: npm install --include=dev
      - name: Validate TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Confirm runtime audit result
        run: npm audit --omit=dev
      - name: Commit validated dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'phireij'
          git config user.email 'phireij@gmail.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No post-Admin dependency changes to commit.'
            exit 0
          fi
          git commit -m 'security: clear compatible residual runtime advisories'
          git push origin HEAD:redesign/mobile-first-v2
