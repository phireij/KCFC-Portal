name: One-shot trusted legacy poll route integration

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-add-legacy-poll-trusted-routes.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply fail-closed trusted route integration
        run: node scripts/one-shot-add-legacy-poll-trusted-routes.mjs

      - name: Verify trusted route integration
        shell: bash
        run: |
          set -euo pipefail
          grep -F "app.post('/api/polls/publish/notify'" server/liturgicalCommunicationRoutes.ts
          grep -F "app.post('/api/polls/completion/notify'" server/liturgicalCommunicationRoutes.ts
          grep -F "app.post('/api/polls/close/notify'" server/liturgicalCommunicationRoutes.ts
          grep -F "legacyPollAudienceIds(" server/liturgicalCommunicationRoutes.ts
          npx tsc --noEmit

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-add-legacy-poll-trusted-routes.mjs
          rm .github/workflows/one-shot-add-legacy-poll-trusted-routes.yml

      - name: Commit branch-only route integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add server/liturgicalCommunicationRoutes.ts scripts/one-shot-add-legacy-poll-trusted-routes.mjs .github/workflows/one-shot-add-legacy-poll-trusted-routes.yml
          git diff --cached --check
          git commit -m 'privacy: add trusted legacy poll notification routes'
          git push origin HEAD:redesign/mobile-first-v2
