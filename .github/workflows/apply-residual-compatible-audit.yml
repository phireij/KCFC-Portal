name: Apply KCFC Residual Compatible Audit Remediation

on:
  push:
    branches:
      - 'redesign/mobile-first-v2'
    paths:
      - '.github/workflows/apply-residual-compatible-audit.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout redevelopment branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply residual non-breaking runtime audit fixes only
        shell: bash
        run: |
          set +e
          npm audit fix --omit=dev
          audit_status=$?
          set -e
          echo "npm audit fix exit status: ${audit_status}; unresolved findings may intentionally keep npm non-zero."
      - name: Restore development dependencies
        run: npm install --include=dev
      - name: Validate TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Show resulting runtime audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev
          exit 0
      - name: Commit only validated non-breaking lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'phireij'
          git config user.email 'phireij@gmail.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No compatible residual dependency changes to commit.'
            exit 0
          fi
          git commit -m 'security: apply residual compatible dependency fixes'
          git push origin HEAD:redesign/mobile-first-v2
