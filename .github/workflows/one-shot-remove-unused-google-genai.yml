name: One-shot remove unused Google GenAI dependency

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-remove-unused-google-genai.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Remove unused dependency with npm
        run: npm uninstall @google/genai

      - name: Verify atomic package cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '"@google/genai"' package.json
          ! grep -F 'node_modules/@google/genai' package-lock.json
          npm ci
          npm run lint
          npm run build

      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-remove-unused-google-genai.yml

      - name: Commit branch-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/one-shot-remove-unused-google-genai.yml
          git diff --cached --check
          git commit -m 'deps: remove unused Google GenAI package'
          git push origin HEAD:redesign/mobile-first-v2
