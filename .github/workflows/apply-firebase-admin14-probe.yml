name: Apply KCFC Firebase Admin 14 Probe

on:
  push:
    branches:
      - 'redesign/mobile-first-v2'
    paths:
      - '.github/workflows/apply-firebase-admin14-probe.yml'

permissions:
  contents: write

jobs:
  probe-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout redevelopment branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Firebase Admin major in branch-only probe
        run: npm install --save firebase-admin@14.4.0
      - name: Validate TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Show runtime audit after Firebase Admin 14
        shell: bash
        run: |
          set +e
          npm audit --omit=dev
          exit 0
      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'phireij'
          git config user.email 'phireij@gmail.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No Firebase Admin dependency change to commit.'
            exit 0
          fi
          git commit -m 'security: upgrade firebase-admin to 14.4.0'
          git push origin HEAD:redesign/mobile-first-v2
