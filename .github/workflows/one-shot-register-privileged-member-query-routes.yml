name: One-shot register privileged member query routes

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-register-privileged-member-query-routes.yml

permissions:
  contents: write

jobs:
  register:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Register trusted privileged member query routes
        run: node scripts/one-shot-register-privileged-member-query-routes.mjs

      - name: Verify privacy boundary and build
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/verify-privileged-member-query-boundary.ts
          npm run lint
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-register-privileged-member-query-routes.mjs
          rm .github/workflows/one-shot-register-privileged-member-query-routes.yml

      - name: Commit branch-only privileged member query routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add -A server.ts server/privilegedMemberQueryRoutes.ts src/lib/privilegedMemberQueries.ts scripts/verify-privileged-member-query-boundary.ts package.json scripts/one-shot-register-privileged-member-query-routes.mjs .github/workflows/one-shot-register-privileged-member-query-routes.yml
          git diff --cached --check
          git commit -m 'privacy: route privileged member summaries on trusted server'
          git push origin HEAD:redesign/mobile-first-v2
