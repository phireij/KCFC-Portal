name: One-shot Updates deep-link focus fix

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/fix-announcement-deep-link-focus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Focus notification-linked announcement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Announcements.tsx')
          s = p.read_text()

          old = "import { useAuth } from '../App';"
          new = "import { useAuth } from '../App';\nimport { useSearchParams } from 'react-router-dom';"
          if s.count(old) != 1:
              raise SystemExit(f'router import anchor count={s.count(old)}')
          s = s.replace(old, new)

          old = "  const { profile, user } = useAuth();\n  const [announcements, setAnnouncements] = useState<ExtendedAnnouncement[]>([]);"
          new = "  const { profile, user } = useAuth();\n  const [searchParams] = useSearchParams();\n  const focusedAnnouncementId = searchParams.get('id');\n  const [announcements, setAnnouncements] = useState<ExtendedAnnouncement[]>([]);"
          if s.count(old) != 1:
              raise SystemExit(f'component state anchor count={s.count(old)}')
          s = s.replace(old, new)

          memo_end = "  }, [announcements, user?.uid, canEditOthers, scope, queryText]);"
          focus_effect = memo_end + "\n\n  useEffect(() => {\n    if (!focusedAnnouncementId || loading) return;\n    if (!visibleAnnouncements.some((announcement) => announcement.id === focusedAnnouncementId)) return;\n\n    const frame = window.requestAnimationFrame(() => {\n      const target = document.getElementById(`announcement-${focusedAnnouncementId}`);\n      if (!target) return;\n      target.scrollIntoView({ behavior: 'smooth', block: 'center' });\n      target.focus({ preventScroll: true });\n    });\n\n    return () => window.cancelAnimationFrame(frame);\n  }, [focusedAnnouncementId, loading, visibleAnnouncements]);"
          if s.count(memo_end) != 1:
              raise SystemExit(f'visible memo anchor count={s.count(memo_end)}')
          s = s.replace(memo_end, focus_effect)

          old_map = "<AnnouncementCard key={announcement.id} announcement={announcement} canEdit={announcement.authorId === user?.uid || canEditOthers} onEdit={() => openEdit(announcement)} onDelete={() => handleDelete(announcement)} />"
          new_map = "<AnnouncementCard key={announcement.id} announcement={announcement} focused={focusedAnnouncementId === announcement.id} canEdit={announcement.authorId === user?.uid || canEditOthers} onEdit={() => openEdit(announcement)} onDelete={() => handleDelete(announcement)} />"
          if s.count(old_map) != 1:
              raise SystemExit(f'card map marker count={s.count(old_map)}')
          s = s.replace(old_map, new_map)

          old_sig = "function AnnouncementCard({ announcement, canEdit, onEdit, onDelete }: { announcement: ExtendedAnnouncement; canEdit: boolean; onEdit: () => void; onDelete: () => void }) {"
          new_sig = "function AnnouncementCard({ announcement, focused, canEdit, onEdit, onDelete }: { announcement: ExtendedAnnouncement; focused: boolean; canEdit: boolean; onEdit: () => void; onDelete: () => void }) {"
          if s.count(old_sig) != 1:
              raise SystemExit(f'card signature marker count={s.count(old_sig)}')
          s = s.replace(old_sig, new_sig)

          old_article = '    <article className="p-4 sm:p-5">'
          new_article = "    <article id={announcement.id ? `announcement-${announcement.id}` : undefined} tabIndex={focused ? -1 : undefined} aria-current={focused ? 'true' : undefined} className={cn('p-4 transition-colors sm:p-5', focused && 'bg-blue-50/60 ring-2 ring-inset ring-blue-400 dark:bg-blue-500/10 dark:ring-blue-400/70')}>"
          if s.count(old_article) != 1:
              raise SystemExit(f'article marker count={s.count(old_article)}')
          s = s.replace(old_article, new_article)

          p.write_text(s)
          PY
          npx tsx scripts/verify-announcement-deep-link-focus.ts
          git diff --check
          git diff -- src/pages/Announcements.tsx
      - name: Commit branch-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Announcements.tsx
          git commit -m 'fix: focus notification-linked update'
          git push origin HEAD:redesign/mobile-first-v2
