name: Apply FCM registration boundary

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-fcm-registration-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-fcm-registration-boundary.py
      - name: Capture verifier diagnostics
        id: verify
        shell: bash
        run: |
          set +e
          npx tsx scripts/verify-fcm-registration-boundary.ts > /tmp/fcm-registration-verifier.txt 2>&1
          status=$?
          cat /tmp/fcm-registration-verifier.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fcm-registration-verifier-${{ github.sha }}
          path: /tmp/fcm-registration-verifier.txt
          retention-days: 1
      - run: test "${{ steps.verify.outputs.status }}" = "0"
      - run: npm run lint
      - run: git diff --check
      - run: |
          rm scripts/patch-fcm-registration-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/lib/fcmClient.ts scripts/verify-fcm-registration-boundary.ts scripts/patch-fcm-registration-boundary.py
          git commit -m 'fix: bound caller-owned FCM device registration'
          git push origin HEAD:redesign/mobile-first-v2
