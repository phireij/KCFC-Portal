name: Apply Community filter history

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-community-filter-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-community-filter-history.py
      - run: npx tsx scripts/verify-community-filter-history.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-community-filter-history.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Members.tsx scripts/patch-community-filter-history.py
          git commit -m 'fix: preserve Community filters in URL history'
          git push origin HEAD:redesign/mobile-first-v2
