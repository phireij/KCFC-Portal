name: One-shot wire Home publication guard

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/wire-dashboard-publication-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Wire permanent publication guard and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/redevelopment-ci.yml')
          s = p.read_text()
          old = "      - name: Verify schedule view history navigation\n        run: npx tsx scripts/verify-schedule-view-history.ts\n\n      - name: Verify delivery diagnostics"
          new = "      - name: Verify schedule view history navigation\n        run: npx tsx scripts/verify-schedule-view-history.ts\n\n      - name: Verify Home roster publication boundary\n        run: npx tsx scripts/verify-dashboard-roster-publication-boundary.ts\n\n      - name: Verify delivery diagnostics"
          if s.count(old) != 1:
              raise SystemExit(f'CI insertion marker count={s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/wire-dashboard-publication-check.yml
          npx tsx scripts/verify-dashboard-roster-publication-boundary.ts
          git diff --check
          git diff -- .github/workflows/redevelopment-ci.yml .github/workflows/wire-dashboard-publication-check.yml
      - name: Commit branch-only CI wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/redevelopment-ci.yml .github/workflows/wire-dashboard-publication-check.yml
          git commit -m 'ci: guard Home roster publication boundary'
          git push origin HEAD:redesign/mobile-first-v2
