name: Apply Web Push client registration boundary

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-webpush-client-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch-webpush-client-boundary.py
      - run: npx tsx scripts/verify-webpush-registration-boundary.ts
      - run: npm run lint
      - run: git diff --check
      - run: |
          rm scripts/patch-webpush-client-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/fcmClient.ts scripts/verify-webpush-registration-boundary.ts scripts/patch-webpush-client-boundary.py
          git commit -m 'fix: require backend Web Push registration boundary'
          git push origin HEAD:redesign/mobile-first-v2
