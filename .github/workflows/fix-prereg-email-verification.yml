name: One-shot pre-registration email verification fix

on:
  push:
    branches:
      - 'redesign/mobile-first-v2'
    paths:
      - '.github/workflows/fix-prereg-email-verification.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2

      - name: Correct pending-profile email verification migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = "isEmailVerified: isBootstrapAdmin || emailVerified || pendingData.isEmailVerified || true,"
          new = "isEmailVerified: isBootstrapAdmin || emailVerified || pendingData.isEmailVerified || false,"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one unsafe pending-profile verification expression, found {count}.')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit branch-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --check
          git commit -m 'fix: preserve preregistered email verification state'
          git push origin HEAD:redesign/mobile-first-v2
