name: One-shot Leadership workspace lazy-load optimization

on:
  push:
    branches:
      - redesign/mobile-first-v2

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redevelopment branch
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Defer non-default Leadership workspaces
        shell: python
        run: |
          from pathlib import Path

          admin_path = Path('src/pages/Admin.tsx')
          source = admin_path.read_text()

          eager_imports = [
              "import BroadcastTool from '../components/admin/BroadcastTool';\n",
              "import CoreStatusPlanner from '../components/admin/CoreStatusPlanner';\n",
              "import LeadershipInquiries from '../components/admin/LeadershipInquiries';\n",
              "import MemberAccountOverview from '../components/admin/MemberAccountOverview';\n",
              "import MemberApprovalQueue from '../components/admin/MemberApprovalQueue';\n",
              "import MemberPreRegistration from '../components/admin/MemberPreRegistration';\n",
              "import MemberRoleEditor from '../components/admin/MemberRoleEditor';\n",
          ]
          for eager in eager_imports:
              if eager not in source:
                  raise SystemExit(f'Expected eager import not found: {eager.strip()}')
              source = source.replace(eager, '', 1)

          legacy_decl = "const LegacyAdmin = React.lazy(() => import('./LegacyAdmin'));\n"
          lazy_decls = """const BroadcastTool = React.lazy(() => import('../components/admin/BroadcastTool'));
const CoreStatusPlanner = React.lazy(() => import('../components/admin/CoreStatusPlanner'));
const LeadershipInquiries = React.lazy(() => import('../components/admin/LeadershipInquiries'));
const MemberAccountOverview = React.lazy(() => import('../components/admin/MemberAccountOverview'));
const MemberApprovalQueue = React.lazy(() => import('../components/admin/MemberApprovalQueue'));
const MemberPreRegistration = React.lazy(() => import('../components/admin/MemberPreRegistration'));
const MemberRoleEditor = React.lazy(() => import('../components/admin/MemberRoleEditor'));
const LegacyAdmin = React.lazy(() => import('./LegacyAdmin'));
"""
          if legacy_decl not in source:
              raise SystemExit('LegacyAdmin lazy declaration marker missing')
          source = source.replace(legacy_decl, lazy_decls, 1)

          replacements = {
              "{activeView === 'inquiries' && <LeadershipInquiries />}": "{activeView === 'inquiries' && <React.Suspense fallback={<WorkspaceLoading label=\"Loading website inquiries…\" />}><LeadershipInquiries /></React.Suspense>}",
              "{activeView === 'broadcast' && <section aria-label=\"Member communications\"><BroadcastTool /></section>}": "{activeView === 'broadcast' && <React.Suspense fallback={<WorkspaceLoading label=\"Loading member communications…\" />}><section aria-label=\"Member communications\"><BroadcastTool /></section></React.Suspense>}",
              "{activeView === 'members' && (\n          <div className=\"space-y-4\">": "{activeView === 'members' && (\n          <React.Suspense fallback={<WorkspaceLoading label=\"Loading member administration…\" />}>\n          <div className=\"space-y-4\">",
              "          </div>\n        )}\n        {activeView === 'advanced'": "          </div>\n          </React.Suspense>\n        )}\n        {activeView === 'advanced'",
              "<React.Suspense fallback={<div className=\"px-4 py-8 text-center text-[12px] font-semibold text-slate-500 dark:text-slate-400\" role=\"status\">Loading advanced legacy tools…</div>}><LegacyAdmin /></React.Suspense>": "<React.Suspense fallback={<WorkspaceLoading label=\"Loading advanced legacy tools…\" />}><LegacyAdmin /></React.Suspense>",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected Leadership render marker not found: {old[:80]}')
              source = source.replace(old, new, 1)

          principle_marker = "function Principle({ title, body }: { title: string; body: string }) {"
          loading_component = """function WorkspaceLoading({ label }: { label: string }) {
  return <div className=\"kcfc-surface px-4 py-8 text-center text-[12px] font-semibold text-slate-500 dark:text-slate-400\" role=\"status\">{label}</div>;
}

"""
          if principle_marker not in source:
              raise SystemExit('Principle helper marker missing')
          source = source.replace(principle_marker, loading_component + principle_marker, 1)
          admin_path.write_text(source)

          verify_path = Path('scripts/verify-admin-workspace-history.ts')
          verify = verify_path.read_text()
          required_marker = '  "const LegacyAdmin = React.lazy(() => import(\'./LegacyAdmin\'));",\n  "<React.Suspense fallback=",'
          expanded = '''  "const BroadcastTool = React.lazy(() => import('../components/admin/BroadcastTool'));",
  "const CoreStatusPlanner = React.lazy(() => import('../components/admin/CoreStatusPlanner'));",
  "const LeadershipInquiries = React.lazy(() => import('../components/admin/LeadershipInquiries'));",
  "const MemberAccountOverview = React.lazy(() => import('../components/admin/MemberAccountOverview'));",
  "const MemberApprovalQueue = React.lazy(() => import('../components/admin/MemberApprovalQueue'));",
  "const MemberPreRegistration = React.lazy(() => import('../components/admin/MemberPreRegistration'));",
  "const MemberRoleEditor = React.lazy(() => import('../components/admin/MemberRoleEditor'));",
  "const LegacyAdmin = React.lazy(() => import('./LegacyAdmin'));",
  "<React.Suspense fallback=",'''
          if required_marker not in verify:
              raise SystemExit('Verifier lazy marker block missing')
          verify = verify.replace(required_marker, expanded, 1)

          old_guard = '''if (source.includes("import LegacyAdmin from './LegacyAdmin';")) {
  throw new Error('Advanced LegacyAdmin must remain behind the leadership lazy-load boundary');
}
'''
          new_guard = '''const eagerWorkspaceImports = [
  "import BroadcastTool from '../components/admin/BroadcastTool';",
  "import CoreStatusPlanner from '../components/admin/CoreStatusPlanner';",
  "import LeadershipInquiries from '../components/admin/LeadershipInquiries';",
  "import MemberAccountOverview from '../components/admin/MemberAccountOverview';",
  "import MemberApprovalQueue from '../components/admin/MemberApprovalQueue';",
  "import MemberPreRegistration from '../components/admin/MemberPreRegistration';",
  "import MemberRoleEditor from '../components/admin/MemberRoleEditor';",
  "import LegacyAdmin from './LegacyAdmin';",
];

for (const eagerImport of eagerWorkspaceImports) {
  if (source.includes(eagerImport)) {
    throw new Error(`Non-default Leadership workspace must remain lazy-loaded: ${eagerImport}`);
  }
}
'''
          if old_guard not in verify:
              raise SystemExit('Existing eager LegacyAdmin guard missing')
          verify = verify.replace(old_guard, new_guard, 1)
          verify_path.write_text(verify)

      - name: Validate targeted contract
        run: npx tsx scripts/verify-admin-workspace-history.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify routine Leadership chunk reduction
        shell: python
        run: |
          from pathlib import Path
          matches = list(Path('dist/assets').glob('Admin-*.js'))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Admin chunk, found {len(matches)}')
          size = matches[0].stat().st_size
          print(f'Routine Admin chunk: {matches[0].name} = {size} bytes')
          if size >= 90000:
              raise SystemExit(f'Admin chunk did not materially improve: {size} bytes >= 90000 byte acceptance ceiling')

      - name: Commit optimized workspace boundaries and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-leadership-workspace-lazy-load.yml
          git add src/pages/Admin.tsx scripts/verify-admin-workspace-history.ts
          git commit -m "perf: defer non-default leadership workspaces"
          git push origin HEAD:redesign/mobile-first-v2
