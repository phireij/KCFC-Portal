name: Apply CI inquiry isolation

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-ci-inquiry-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-ci-inquiry-isolation.py
      - run: npx tsx scripts/verify-staging-inquiry-email-isolation.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-ci-inquiry-isolation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/redevelopment-ci.yml scripts/patch-ci-inquiry-isolation.py
          git commit -m 'ci: guard staging inquiry email isolation'
          git push origin HEAD:redesign/mobile-first-v2
