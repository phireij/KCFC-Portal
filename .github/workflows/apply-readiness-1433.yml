name: Apply readiness 1433 sync

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-readiness-1433.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-readiness-1433.py
      - run: git diff --check
      - run: |
          rm scripts/patch-readiness-1433.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/redevelopment/production-readiness-evidence-2026-09-11.md docs/redevelopment/staging-deployment-runbook-2026-09-11.md docs/redevelopment/staging-readiness-checklist.md docs/redevelopment/staging-evidence-log.md scripts/patch-readiness-1433.py
          git commit -m 'docs: sync readiness evidence to CI 1433'
          git push origin HEAD:redesign/mobile-first-v2
