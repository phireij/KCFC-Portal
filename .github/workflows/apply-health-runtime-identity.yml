name: Apply health runtime identity

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-health-runtime-identity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-health-runtime-identity.py
      - run: npx tsx scripts/verify-health-runtime-identity.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-health-runtime-identity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/patch-health-runtime-identity.py
          git commit -m 'feat: expose safe runtime identity in health endpoint'
          git push origin HEAD:redesign/mobile-first-v2
