name: One-shot schedule history fix

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/fix-schedule-view-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - name: Patch schedule subview history
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Duties.tsx')
          s = p.read_text()

          old = "  const [searchParams] = useSearchParams();\n  const requestedView = searchParams.get('view');\n  const [view, setView] = useState<ScheduleView>(() => {\n    if (requestedView === 'mine') return 'mine';\n    if (searchParams.get('tab') || searchParams.get('pollId')) return 'manage';\n    return 'all';\n  });"
          new = "  const [searchParams, setSearchParams] = useSearchParams();\n  const requestedView = searchParams.get('view');\n  const [view, setView] = useState<ScheduleView>(() => {\n    if (requestedView === 'all' || requestedView === 'mine' || requestedView === 'manage') return requestedView;\n    if (searchParams.get('tab') || searchParams.get('pollId')) return 'manage';\n    return 'all';\n  });"
          if s.count(old) != 1:
              raise SystemExit(f'initial search-param block count={s.count(old)}')
          s = s.replace(old, new)

          old = "  useEffect(() => {\n    if (searchParams.get('view') === 'mine') setView('mine');\n    else if (searchParams.get('tab') || searchParams.get('pollId')) setView('manage');\n  }, [searchParams]);"
          new = "  useEffect(() => {\n    if (requestedView === 'all' || requestedView === 'mine' || requestedView === 'manage') {\n      setView(requestedView);\n    } else if (searchParams.get('tab') || searchParams.get('pollId')) {\n      setView('manage');\n    } else {\n      setView('all');\n    }\n  }, [requestedView, searchParams]);\n\n  const selectView = (nextView: ScheduleView) => {\n    setView(nextView);\n    setSearchParams((currentParams) => {\n      const nextParams = new URLSearchParams(currentParams);\n      nextParams.set('view', nextView);\n      if (nextView !== 'manage') {\n        nextParams.delete('tab');\n        nextParams.delete('pollId');\n      }\n      return nextParams;\n    });\n  };"
          if s.count(old) != 1:
              raise SystemExit(f'view sync effect count={s.count(old)}')
          s = s.replace(old, new)

          replacements = {
            "onClick={() => setView('all')}": "onClick={() => selectView('all')}",
            "onClick={() => setView('mine')}": "onClick={() => selectView('mine')}",
            "onClick={() => setView('manage')}": "onClick={() => selectView('manage')}",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'button marker {old!r} count={s.count(old)}')
              s = s.replace(old, new)

          p.write_text(s)
          PY
          npx tsx scripts/verify-schedule-view-history.ts
          git diff --check
          git diff -- src/pages/Duties.tsx
      - name: Commit branch-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Duties.tsx
          git commit -m 'fix: persist schedule subview in navigation history'
          git push origin HEAD:redesign/mobile-first-v2
