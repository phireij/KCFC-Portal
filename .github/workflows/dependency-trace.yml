name: KCFC Dependency Trace

on:
  push:
    branches:
      - 'redesign/mobile-first-v2'
    paths:
      - '.github/workflows/dependency-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Trace remaining critical and high package ownership
        shell: bash
        run: |
          set +e
          npm ls websocket-driver @grpc/grpc-js browserslist form-data nanoid nodemailer postcss protobufjs ws --all
          exit 0
      - name: Preview non-breaking npm remediation
        shell: bash
        run: |
          set +e
          npm audit fix --omit=dev --dry-run --json > /tmp/kcfc-audit-dry-run.json
          status=$?
          node - <<'NODE'
          const fs = require('fs');
          const p = '/tmp/kcfc-audit-dry-run.json';
          try {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(JSON.stringify({
              added: data.added,
              removed: data.removed,
              changed: data.changed,
              audited: data.audited,
              vulnerabilities: data.audit?.metadata?.vulnerabilities || data.metadata?.vulnerabilities || null
            }, null, 2));
          } catch (e) {
            console.log('Dry-run JSON could not be summarized:', e.message);
          }
          NODE
          echo "dry-run exit status: $status"
          exit 0
