name: Apply generic public inquiry error response

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-public-inquiry-error-response.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-public-inquiry-error-response.py
      - run: npx tsx scripts/verify-inquiry-privacy-logging.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-public-inquiry-error-response.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-inquiry-privacy-logging.ts scripts/patch-public-inquiry-error-response.py
          git commit -m 'fix: return generic public inquiry server errors'
          git push origin HEAD:redesign/mobile-first-v2
