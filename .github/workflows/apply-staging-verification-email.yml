name: Apply staging verification email isolation

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-staging-verification-email.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-staging-verification-email.py
      - run: npx tsx scripts/verify-staging-verification-email-isolation.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-staging-verification-email.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-staging-verification-email-isolation.ts scripts/patch-staging-verification-email.py
          git commit -m 'fix: isolate staging verification email delivery'
          git push origin HEAD:redesign/mobile-first-v2
