name: Apply strict staging Web Push catch

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-staging-webpush-catch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-staging-webpush-catch.py
      - run: npx tsx scripts/verify-staging-webpush-runtime.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-staging-webpush-catch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/verify-staging-webpush-runtime.ts scripts/patch-staging-webpush-catch.py
          git commit -m 'fix: make staging Web Push fail closed after init errors'
          git push origin HEAD:redesign/mobile-first-v2
