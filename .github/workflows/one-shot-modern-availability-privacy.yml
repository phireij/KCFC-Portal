name: One-shot modern Availability privacy migration

# One-shot retry with current Polls.tsx anchors only; fail closed on any unexpected source drift.
on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-modern-availability-privacy.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Apply fail-closed Availability migration
        run: node scripts/one-shot-migrate-modern-availability-privacy.mjs

      - name: Verify privacy postconditions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "collection(db, 'users')" src/pages/Polls.tsx
          ! grep -F 'UserProfile' src/pages/Polls.tsx
          grep -F 'subscribeMemberDirectory(' src/pages/Polls.tsx
          grep -F 'notifyAvailabilityRequest(created.id)' src/pages/Polls.tsx
          grep -F 'notifyAvailabilityCompletion(poll.id)' src/pages/Polls.tsx
          grep -F 'planLiturgicalRosterPublication(poll.id)' src/pages/Polls.tsx
          grep -F 'publishLiturgicalRoster(poll.id)' src/pages/Polls.tsx
          npx tsc --noEmit

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-migrate-modern-availability-privacy.mjs
          rm .github/workflows/one-shot-modern-availability-privacy.yml

      - name: Commit branch-only migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add src/pages/Polls.tsx scripts/one-shot-migrate-modern-availability-privacy.mjs .github/workflows/one-shot-modern-availability-privacy.yml
          git diff --cached --check
          git commit -m 'privacy: move modern Availability off private profiles'
          git push origin HEAD:redesign/mobile-first-v2
