name: Apply esbuild 0.28.2 remediation

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-esbuild-0282.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev tsx@4.23.13 esbuild@0.28.2
      - run: npm ls tsx esbuild
      - name: Verify esbuild audit finding is closed
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/kcfc-audit.json
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/kcfc-audit.json', 'utf8'));
          if (audit.vulnerabilities && audit.vulnerabilities.esbuild) {
            console.error(JSON.stringify(audit.vulnerabilities.esbuild, null, 2));
            process.exit(1);
          }
          console.log('esbuild audit finding: CLOSED');
          NODE
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit supported tooling remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: update tsx and esbuild to patched releases'
          git push origin HEAD:redesign/mobile-first-v2
