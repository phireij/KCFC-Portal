name: One-shot close auth projection sync gap

on:
  push:
    branches:
      - redesign/mobile-first-v2
    paths:
      - .github/workflows/one-shot-close-auth-projection-sync-gap.yml

permissions:
  contents: write

jobs:
  close-gap:
    if: github.ref == 'refs/heads/redesign/mobile-first-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply fail-closed auth synchronization patch
        run: node scripts/one-shot-close-auth-projection-sync-gap.mjs

      - name: Verify synchronization and application build
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'syncOwnMemberDirectoryProfile' src/pages/Login.tsx
          grep -F 'syncOwnMemberDirectoryProfile' src/App.tsx
          npx tsx scripts/verify-member-directory-sync-boundary.ts
          npm run lint
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/one-shot-close-auth-projection-sync-gap.mjs
          rm .github/workflows/one-shot-close-auth-projection-sync-gap.yml

      - name: Commit branch-only auth synchronization patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kcfc-ci-bot'
          git config user.email 'kcfc-ci-bot@users.noreply.github.com'
          git add src/pages/Login.tsx src/App.tsx scripts/verify-member-directory-sync-boundary.ts scripts/one-shot-close-auth-projection-sync-gap.mjs .github/workflows/one-shot-close-auth-projection-sync-gap.yml
          git diff --cached --check
          git commit -m 'privacy: self-heal directory projection during authentication'
          git push origin HEAD:redesign/mobile-first-v2
