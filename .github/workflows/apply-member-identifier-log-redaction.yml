name: Apply member identifier log redaction

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-member-identifier-log-redaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-member-identifier-logging.py
      - run: npx tsx scripts/verify-server-diagnostic-privacy.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-member-identifier-logging.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/patch-member-identifier-logging.py
          git commit -m 'fix: redact member identifiers from server diagnostics'
          git push origin HEAD:redesign/mobile-first-v2
