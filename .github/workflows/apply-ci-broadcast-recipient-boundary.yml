name: Apply permanent broadcast recipient CI guard

on:
  push:
    branches: [redesign/mobile-first-v2]
    paths:
      - '.github/workflows/apply-ci-broadcast-recipient-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/mobile-first-v2
          fetch-depth: 0
      - run: python3 scripts/patch-ci-broadcast-recipient-boundary.py
      - run: npx tsx scripts/verify-broadcast-recipient-token-boundary.ts
      - run: git diff --check
      - run: |
          rm scripts/patch-ci-broadcast-recipient-boundary.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/redevelopment-ci.yml scripts/patch-ci-broadcast-recipient-boundary.py
          git commit -m 'test: enforce server-derived broadcast recipients in CI'
          git push origin HEAD:redesign/mobile-first-v2
